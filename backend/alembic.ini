# Alembic configuration - no credentials.
#
# The database URL is NOT defined here: `migrations/env.py` builds it from
# `Settings` (the application environment variables). This file is therefore
# versioned without user, password or database name, and passwords containing
# `%`, `@` or `:` are not affected by `.ini` interpolation.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# logging

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
